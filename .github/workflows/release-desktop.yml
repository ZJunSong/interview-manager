name: Build and Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        
      - name: Install dependencies
        run: pnpm install
        
      - name: Build desktop version
        run: pnpm --filter @interview-manager/desktop build:win
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: packages/desktop/dist-desktop/*.exe
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-installer
          path: ./dist-desktop
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist-desktop/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
