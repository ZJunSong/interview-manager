name: Bug 报告
description: 报告一个问题帮助我们改进
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 描述遇到的问题，包括期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 xxx
        2. 点击 xxx
        3. 出现 xxx
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 本地部署（Node.js）
        - 服务器部署（Docker）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境信息
      description: 浏览器、操作系统、Node/Docker 版本等
