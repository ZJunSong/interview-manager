# ============================================
# InterviewManager Web - Docker Compose
# 腾讯云服务器部署配置
# ============================================
# 使用方法:
#   1. 复制 .env.example 为 .env 并修改密钥
#   2. docker compose up -d
#   3. 访问 http://your-server-ip
#
# 如需 HTTPS:
#   1. 取消注释 nginx-ssl 服务
#   2. 将证书文件放入 nginx/ssl/ 目录
#   3. 修改 nginx/default-ssl.conf 中的域名
# ============================================

services:
  # ---------- Node.js 应用服务 ----------
  app:
    build:
      context: ../..
      dockerfile: packages/web/Dockerfile
    container_name: interview-manager-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - DATA_DIR=/app/data
    volumes:
      - app-data:/app/data
    networks:
      - internal
    # 不直接暴露端口，通过 nginx 访问
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------- Nginx 反向代理 ----------
  nginx:
    image: nginx:alpine
    container_name: interview-manager-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # HTTPS 端口（启用 SSL 时取消注释）
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书（启用 HTTPS 时取消注释）
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  # ---------- HTTPS + 自动续签（可选）----------
  # 取消注释以启用 Let's Encrypt 自动 HTTPS
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: interview-manager-certbot
  #   volumes:
  #     - ./nginx/ssl:/etc/letsencrypt
  #     - certbot-data:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - internal

volumes:
  app-data:
    driver: local
    # 可选：指定宿主机路径（取消注释）
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/interview-manager

networks:
  internal:
    driver: bridge
