services:
  app:
    build:
      context: ../..
      dockerfile: packages/web/Dockerfile
    container_name: interview-manager-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 强制要求 .env 中配置 JWT_SECRET，缺失时拒绝启动，避免静默回退到不安全默认值
      - JWT_SECRET=${JWT_SECRET:?请在 packages/web/.env 中设置 JWT_SECRET（可用 openssl rand -hex 32 生成）}
      - DATA_DIR=/app/data
    volumes:
      - app-data:/app/data
    networks:
      - internal
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    container_name: interview-manager-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        # 健康状态来自镜像内置 HEALTHCHECK
        condition: service_healthy
    networks:
      - internal

volumes:
  app-data:

networks:
  internal:
    driver: bridge
