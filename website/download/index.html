<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下载 - Interview Manager</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">Interview<span>Manager</span></a>
      <div class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/download/" class="nav-link active">下载</a>
        <a href="/docs/" class="nav-link">文档</a>
        <a href="/donate/" class="nav-link">打赏</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <h1 class="page-title">下载</h1>
    <p class="page-desc">适用于 Windows 10/11 (64位)，下载安装即用</p>
  </div>

  <div class="content-section">
    <div class="container">
      <div class="download-card">
        <h3>Windows 桌面版</h3>
        <p class="version">当前版本: <span id="version">v1.0.0</span></p>
        
        <ul class="download-features">
          <li>无需安装 Node.js，双击即用</li>
          <li>数据存储在本地，完全离线可用</li>
          <li>无账号要求，隐私完全自主</li>
          <li>支持导入导出 JSON 备份</li>
        </ul>
        
        <a id="download-btn" href="#" class="btn btn-primary btn-block">
          下载安装包 (.exe)
        </a>
        
        <p style="margin-top: 20px; font-size: 13px; color: var(--text-muted);">
          文件大小: <span id="file-size">约 80MB</span> · 下载来自 GitHub Releases
        </p>
      </div>

      <div style="max-width: 600px; margin: 0 auto;">
        <h2 style="font-size: 24px; margin-bottom: 24px;">更新日志</h2>
        <div style="padding: 20px; background: var(--bg-warm); border-radius: var(--radius); margin-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <strong>v1.0.0</strong>
            <span style="color: var(--text-muted); font-size: 14px;">2024-01-01</span>
          </div>
          <p style="color: var(--text-secondary); font-size: 14px;">初始版本发布</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-info">
          <p>Interview Manager</p>
        </div>
        <div class="footer-links">
          <a href="/">首页</a>
          <a href="/download/">下载</a>
          <a href="/docs/">文档</a>
          <a href="/donate/">打赏</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    async function loadLatestRelease() {
      try {
        const response = await fetch('https://api.github.com/repos/your-username/InterviewManager/releases/latest');
        if (response.ok) {
          const release = await response.json();
          document.getElementById('version').textContent = release.tag_name;
          const windowsAsset = release.assets.find(a => a.name.endsWith('.exe'));
          if (windowsAsset) {
            document.getElementById('download-btn').href = windowsAsset.browser_download_url;
            document.getElementById('file-size').textContent = `${(windowsAsset.size / 1024 / 1024).toFixed(1)}MB`;
          }
        }
      } catch (error) {
        console.log('Using default version info');
      }
    }
    loadLatestRelease();
  </script>
</body>
</html>
