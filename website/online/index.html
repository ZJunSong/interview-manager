<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线使用 - Interview Manager</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">Interview<span>Manager</span></a>
      <div class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/download/" class="nav-link">下载</a>
        <a href="/docs/" class="nav-link">文档</a>
        <a href="/donate/" class="nav-link">打赏</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <h1 class="page-title">在线使用</h1>
    <p class="page-desc">浏览器直接使用，无需安装，数据云端同步</p>
  </div>

  <div class="content-section">
    <div class="container">
      <div class="online-embed">
        <iframe src="https://your-web-app-url.com" title="Interview Manager Online"></iframe>
      </div>

      <div class="online-features">
        <div class="online-feature">
          <div class="icon">◎</div>
          <h4>多设备同步</h4>
          <p>在手机、平板、电脑上随时访问你的面试数据</p>
        </div>
        <div class="online-feature">
          <div class="icon">☁</div>
          <h4>云端存储</h4>
          <p>数据安全存储在云端，不用担心本地文件丢失</p>
        </div>
        <div class="online-feature">
          <div class="icon">↻</div>
          <h4>实时更新</h4>
          <p>自动获取最新功能，无需手动更新</p>
        </div>
      </div>

      <div style="max-width: 600px; margin: 0 auto; padding: 20px 24px; background: var(--bg-warm); border-radius: var(--radius); border-left: 3px solid var(--accent);">
        <p style="font-size: 14px; color: var(--text-secondary); margin: 0;">
          <strong>隐私提示：</strong>在线版本需要账号登录，面试数据将存储在服务器上。如果你对隐私有较高要求，建议使用 Windows 桌面版，数据完全存储在本地。
        </p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-info">
          <p>Interview Manager</p>
        </div>
        <div class="footer-links">
          <a href="/">首页</a>
          <a href="/download/">下载</a>
          <a href="/docs/">文档</a>
          <a href="/donate/">打赏</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
