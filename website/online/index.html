<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线使用 - Interview Manager</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .online-page {
      padding: 120px 24px 80px;
      min-height: 100vh;
    }
    
    .online-container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }
    
    .online-header {
      margin-bottom: 40px;
    }
    
    .online-header h1 {
      font-size: 36px;
      margin-bottom: 16px;
    }
    
    .online-header p {
      color: var(--text-secondary);
      font-size: 18px;
    }
    
    .online-frame {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      margin-bottom: 40px;
    }
    
    .online-frame iframe {
      width: 100%;
      height: 70vh;
      border: none;
    }
    
    .online-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      text-align: left;
    }
    
    .info-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    
    .info-card h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    
    .info-card p {
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    .privacy-notice {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 16px 24px;
      margin-top: 32px;
      text-align: left;
    }
    
    .privacy-notice strong {
      color: #856404;
    }
    
    .privacy-notice p {
      color: #856404;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">📋 Interview Manager</a>
      <div class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/download/" class="nav-link">下载</a>
        <a href="/docs/" class="nav-link">文档</a>
        <a href="/donate/" class="nav-link">打赏</a>
      </div>
    </div>
  </nav>

  <div class="online-page">
    <div class="online-container">
      <div class="online-header">
        <h1>在线使用</h1>
        <p>浏览器直接使用，无需安装，数据云端同步</p>
      </div>
      
      <div class="online-frame">
        <iframe src="https://your-web-app-url.com" title="Interview Manager Online"></iframe>
      </div>
      
      <div class="online-info">
        <div class="info-card">
          <h3>📱 多设备同步</h3>
          <p>在手机、平板、电脑上随时访问你的面试数据</p>
        </div>
        <div class="info-card">
          <h3>☁️ 云端存储</h3>
          <p>数据安全存储在云端，不用担心本地文件丢失</p>
        </div>
        <div class="info-card">
          <h3>🔄 实时更新</h3>
          <p>自动获取最新功能，无需手动更新</p>
        </div>
      </div>
      
      <div class="privacy-notice">
        <strong>⚠️ 隐私提醒</strong>
        <p>在线版本需要账号登录，面试数据将存储在服务器上。如果你对隐私有较高要求，建议使用 Windows 桌面版，数据完全存储在本地。</p>
      </div>
    </div>
  </div>
</body>
</html>
