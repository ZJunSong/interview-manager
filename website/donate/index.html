<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打赏 - Interview Manager</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">Interview<span>Manager</span></a>
      <div class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/download/" class="nav-link">下载</a>
        <a href="/docs/" class="nav-link">文档</a>
        <a href="/donate/" class="nav-link active">打赏</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <h1 class="page-title">支持项目</h1>
    <p class="page-desc">如果你觉得这个工具对你有帮助，可以请作者喝杯咖啡</p>
  </div>

  <div class="content-section">
    <div class="container">
      <div class="donate-content">
        <div class="qr-grid">
          <div class="qr-card">
            <h4>微信</h4>
            <div class="qr-placeholder">
              二维码占位
            </div>
          </div>
          
          <div class="qr-card">
            <h4>支付宝</h4>
            <div class="qr-placeholder">
              二维码占位
            </div>
          </div>
        </div>

        <div style="margin-top: 64px; padding: 40px; background: var(--bg-warm); border-radius: var(--radius-lg);">
          <h2 style="font-size: 24px; margin-bottom: 20px;">关于这个项目</h2>
          <p style="color: var(--text-secondary); line-height: 1.9; margin-bottom: 16px;">
            Interview Manager 是一个完全开源的项目，代码托管在 GitHub 上，任何人都可以查看、使用和贡献。
          </p>
          <p style="color: var(--text-secondary); line-height: 1.9; margin-bottom: 16px;">
            这个工具是完全免费使用的，打赏是自愿的，用于支持项目的持续维护和开发。
          </p>
          <p style="color: var(--text-secondary); line-height: 1.9;">
            感谢每一位用户的支持和反馈，让这个工具变得更好。
          </p>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-info">
          <p>Interview Manager</p>
        </div>
        <div class="footer-links">
          <a href="/">首页</a>
          <a href="/download/">下载</a>
          <a href="/docs/">文档</a>
          <a href="/donate/">打赏</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
